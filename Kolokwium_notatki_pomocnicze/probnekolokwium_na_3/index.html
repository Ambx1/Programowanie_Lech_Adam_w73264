<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolokwium - Adam Lech 73264 - Strona do zamawiania bukietów</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Strona do zamawiania bukietów</h1>
        <p>Adam Lech 73264</p>
        <hr> 
    </header>
    <nav>
        <ul class="_KLASA_FLEXBOX_">
            <li><a href="#formularz-glowny-sekcja">Formularz Zgłoszeniowy</a></li>
            <li><a href="#tabela-danych-sekcja">Tabela / Koszyk</a></li>
        </ul>
        <hr>
    </nav>

    <main>
        <section id="formularz-glowny-sekcja"> 
            <h2>Wypełnij dane</h2>
        <!-- ================================================================================= -->
        <!-- zad na 3  formularz zawierający pola wyboru rodzaju bukietu i danych kontaktowych -->
        <!-- ================================================================================= -->
        <form id="_ID_FORMULARZA_" novalidate>   
            <fieldset>
                    <legend>Wybór rodzaju bukietu</legend>
                    <label for="_Rodaj_Bukietu">Wybierz rodzaj bukietu:</label>
                    <select id="_Rodaj_Bukietu" name="_Rodaj_Bukietu" required>
                        <option value="">-- Wybierz z listy --</option>
                        <option value="różowy_różany">różowy różany</option>
                        <option value="biały_lilak">biały lilak</option>
                        <option value="bordowe_chryzantemy">bordowe chryzantemy</option>
                    </select>
                    <!-- [DOBRA PRAKTYKA UX] Pusty div, w którym JS umieści czerwony błąd! -->
                    <div class="error-msg" id="_ERROR_Wybur_Bukietu_"></div>

                    <label for="_Input_Ilosc_Bukietu_">Ilość :</label>
                    <input type="number" id="_Input_Ilosc_Bukietu_" name="_Input_Ilosc_Bukietu_" min="1" max="50" value="1" required>
                    <div class="error-msg" id="_ERROR_ILOSC_"></div>
                    
                </fieldset>
  
                <fieldset>
                    <legend>1. Dane Kontaktowe i Podstawowe </legend>
                    
                    <label for="_INPUT_IMIE_">Imię :</label>
                    <input type="text" id="_INPUT_IMIE_" name="_INPUT_IMIE_" minlength="2" required>
                    <div class="error-msg" id="_ERROR_IMIE_"></div>
                    
                    <label for="_INPUT_NAZWISKO_">Nazwisko :</label>
                    <input type="text" id="_INPUT_NAZWISKO_" name="_INPUT_NAZWISKO_" minlength="2" required>
                    <div class="error-msg" id="_ERROR_IMIE_"></div>

                    <label for="_INPUT_EMAIL_">E-mail:</label>
                    <input type="email" id="_INPUT_EMAIL_" name="_INPUT_EMAIL_" required>
                    <div class="error-msg" id="_ERROR_EMAIL_"></div>
                    
                    <label for="_INPUT_TELEFON_">Telefon (Tylko cyfry, Regex w JS):</label>
                    <input type="tel" id="_INPUT_TELEFON_" name="_INPUT_TELEFON_" required>
                    <div class="error-msg" id="_ERROR_TELEFON_"></div>

                    <!-- Przycisk typu 'button' NIE WYSYŁA formularza. Używamy go w JS do dodawania obiektów do koszyka -->
                    <button type="submit" id="_BTN_DODAJ_DO_KOSZYKA_">Dodaj do koszyka</button>
                </fieldset>
        </form>         
        </section>
    </main>
</body>
